name: Play Store release

# Builds the signed release bundle and ships it to a Google Play track.
#   - push a tag  v1.2.3      -> versionName 1.2.3, internal track
#   - Run workflow (manual)   -> pick track / status, or build-only
# Setup and required secrets: see RELEASING.md

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      status:
        description: Release status (an app that was never published only accepts "draft")
        type: choice
        options: [draft, completed]
        default: draft
      upload:
        description: Upload to Google Play (off = only build the signed AAB artifact)
        type: boolean
        default: true

# Never run two Play uploads at once; never cancel one half-way.
concurrency:
  group: play-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRACK: ${{ inputs.track || 'internal' }}
      STATUS: ${{ inputs.status || vars.PLAY_RELEASE_STATUS || 'draft' }}
      # Tag pushes have no inputs and always upload.
      UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Restore upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set (see RELEASING.md)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Resolve version
        run: |
          # Play needs a strictly increasing versionCode; the run number gives one for free.
          ARGS="-PversionCode=$((GITHUB_RUN_NUMBER + 100))"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then ARGS="$ARGS -PversionName=${GITHUB_REF_NAME#v}"; fi
          echo "VERSION_ARGS=$ARGS" >> "$GITHUB_ENV"
          echo "Version args: $ARGS" >> "$GITHUB_STEP_SUMMARY"

      - name: Unit tests + signed release bundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # shellcheck disable=SC2086 # VERSION_ARGS is a list of -P flags, split on purpose
          ./gradlew testDebugUnitTest bundleRelease $VERSION_ARGS --stacktrace

      # Nothing after the build needs the key; keep it away from the later third-party steps.
      - name: Remove upload keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      # jarsigner exits 0 for an unsigned jar, so the grep is what fails the step.
      - name: Verify the bundle is signed
        run: |
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | tee verify.txt
          grep -q "jar verified" verify.txt

      - name: Upload bundle artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: generation-camera-release
          retention-days: 14
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt

      - name: Set up Ruby (fastlane)
        if: env.UPLOAD == 'true'
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Upload to Google Play
        if: env.UPLOAD == 'true'
        env:
          SUPPLY_JSON_KEY_DATA: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$SUPPLY_JSON_KEY_DATA" ]; then
            echo "::error::Secret PLAY_SERVICE_ACCOUNT_JSON is not set (see RELEASING.md). The signed AAB is attached to this run as an artifact."; exit 1
          fi
          bundle exec fastlane android deploy track:"$TRACK" status:"$STATUS"
          echo "Uploaded to Play track \`$TRACK\` as \`$STATUS\`" >> "$GITHUB_STEP_SUMMARY"
